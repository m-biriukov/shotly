[package]
name = "screenshoot"
version = "0.1.0"
edition = "2024"
# Let-chains (`if let … && …`) need 1.88.
rust-version = "1.88"
license = "MIT"
description = "A macOS menu-bar screenshot tool with annotations"
repository = "https://github.com/m-biriukov/screenshoot"

[features]
# Developer-only switches (SCREENSHOOT_PROFILE, SCREENSHOOT_TEST_CAPTURE,
# SCREENSHOOT_TEST_TOAST, SCREENSHOOT_TEST_SETTINGS). Off in normal builds so
# the installed app ignores those variables.
dev-hooks = []

[dependencies]
anyhow = "1.0.104"
arboard = "3"
block2 = "0.6"
chrono = "0.4"
dirs = "7"
global-hotkey = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "libc",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "SCScreenshotManager",
    "SCShareableContent",
    "SCStream",
] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
skrifa = "0.49.0"
softbuffer = "0.4"
tiny-skia = "0.11"
toml = "1"
tray-icon = "0.26"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

# Lints beyond clippy's defaults; CI runs clippy with `-D warnings`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Every `unsafe` block must say why it is sound.
undocumented_unsafe_blocks = "warn"
# Readability picks from `clippy::pedantic`/`nursery` (the cast lints stay off:
# pixel math converts between i32/u32/f32/f64 on purpose).
use_self = "warn"
doc_markdown = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
